name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bloc
          POSTGRES_USER: bloc
          POSTGRES_PASSWORD: bloc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: bloc
      DATABASE_USER: bloc
      DATABASE_PASSWORD: bloc
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret
      POSTHOG_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchman=false

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: CDK synth
        working-directory: infrastructure
        run: npm run synth
